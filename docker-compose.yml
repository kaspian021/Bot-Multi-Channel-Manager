version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aichannel_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aichannelmanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aichannelmanager"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aichannel_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aichannel_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DEMO_MODE: "true"
      DATABASE_CONNECTION_STRING: postgresql://postgres:postgrespassword@postgres:5432/aichannelmanager
      REDIS_CONNECTION_STRING: redis://redis:6379
      APP_PUBLIC_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aichannel_worker
    restart: always
    command: ["npm", "run", "worker"]
    environment:
      NODE_ENV: production
      DEMO_MODE: "true"
      DATABASE_CONNECTION_STRING: postgresql://postgres:postgrespassword@postgres:5432/aichannelmanager
      REDIS_CONNECTION_STRING: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
